<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="/manifest.json"><title>EmergencyLink</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><h1>EmergencyLink</h1><p>Cloud-Connected Emergency Communication</p></div><span id="net" class="pill">Checking…</span></header><main>
<section id="auth" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><div class="row"><button id="login">Sign in</button><button id="register" class="dark">Create account</button></div><p id="authMsg"></p></section>
<section id="app" hidden><nav class="tabs"><button data-tab="report">Emergency Report</button><button data-tab="mesh">Mesh</button><button data-tab="dashboard">Dashboard</button></nav>
<section id="report" class="tab card"><h2>Report an Emergency</h2><form id="incidentForm"><label>Type of incident<select id="incidentType" required><option value="">Select</option><option>Fire</option><option>Road Accident</option><option>Flood</option><option>Medical Emergency</option><option>Security Threat</option><option>Other</option></select></label><label>Location<input id="location" required placeholder="e.g. Ikeja, Lagos"></label><label>Emergency number<input id="emergencyNumber" required value="112"></label><label>Description<textarea id="description" required rows="5"></textarea></label><button>Send Emergency Report</button></form><p id="sendMsg"></p></section>
<section id="mesh" class="tab card" hidden><h2>Peer / Mesh Relay</h2><p>Connected peers: <b id="peerCount">0</b></p><div class="route"><b>This device</b><span>→</span><b>Peer</b><span>→</span><b>Gateway</b><span>→</span><b>Cloud</b></div><p class="small">The transport layer is designed for encrypted WebRTC data channels after peers are discovered and negotiated.</p><button id="connectPeers">Refresh peer discovery</button><div id="peerList"></div></section>
<section id="dashboard" class="tab card" hidden><div class="between"><h2>Emergency Dashboard</h2><button id="sync" class="dark">Sync Pending</button></div><div id="reports"></div></section>
</section></main><script src="/app.js"></script></body></html>
